  <meta name="description" content="Calculadora de edad humana para perros, gatos, conejos y hámsters.">
  <meta name="theme-color" content="#1c362f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="edad" data-header="dark">
<main>
  <section class="page-hero">
    <div class="container">
      <a href="index.html" class="back"><span class="circle">←</span>Volver a VetLu</a>
      <p class="eyebrow" style="color:var(--gold-soft)">Edad humana</p>
      <h1>Su edad en <em>años humanos</em></h1>
      <p class="lead">La regla de “1 año = 7” es un mito.</p>
    </div>
  </section>

  <section class="section section--sand">
    <div class="container"><div class="reveal" data-age-calc=""></div></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><p class="eyebrow">Tablas</p><h2>Equivalencias <em>por especie</em></h2></div>
      <div class="grid grid-2" id="ageTables"></div>
    </div>
  </section>

  <section class="section section--dark">
    <div class="container split">
      <div class="reveal">
        <p class="eyebrow">¿Por qué no es 1 = 7?</p>
        <h2>El primer año <em>vale por quince</em></h2>
        <ul class="checks">
          <li>1 año ≈ 15 años humanos.</li>
          <li>2 años ≈ 24 años humanos.</li>
          <li>Luego, de 4 a 7 años por año, según el tamaño.</li>
        </ul>
      </div>
      <div class="media reveal" data-delay="1"><img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=900&q=72" alt="Perro" loading="lazy"></div>
    </div>
  </section>
</main>
